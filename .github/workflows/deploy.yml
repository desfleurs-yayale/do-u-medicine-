name: Deploy Silver Memoir preview to Pages

on:
  push:
    branches: [silver-memoir-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site content
        run: |
          mkdir -p /tmp/site
          cp index.html /tmp/site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
