name: Deploy preview to surge.sh

on:
  push:
    branches: [silver-memoir-preview]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install surge
        run: npm install -g surge

      - name: Deploy to surge.sh (two domains)
        env:
          SURGE_TOKEN: 8bf75edb518aadde91176bc66391b139
        run: |
          mkdir -p site
          cp index.html site/
          surge --token "$SURGE_TOKEN" site/ guangyin-shoutie.surge.sh
          surge --token "$SURGE_TOKEN" site/ guangyin-shoutie-2.surge.sh

      - name: Verify deployment
        run: |
          sleep 8
          for D in guangyin-shoutie.surge.sh guangyin-shoutie-2.surge.sh; do
            CODE=$(curl -s -o /tmp/p.html -w "%{http_code}" https://$D/)
            SIZE=$(wc -c < /tmp/p.html)
            echo "$D http=$CODE size=$SIZE"
            grep -q "光阴手帖" /tmp/p.html && echo "$D CONTENT OK" || echo "$D CONTENT MISMATCH"
            [ "$CODE" = "200" ] && [ "$SIZE" -gt 100000 ]
          done
