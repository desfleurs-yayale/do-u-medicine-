name: Deploy preview to surge.sh

on:
  push:
    branches: [silver-memoir-preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install surge
        run: npm install -g surge

      - name: Deploy to surge.sh
        env:
          SURGE_LOGIN: guangyin.shoutie.2026@gmail.com
          SURGE_PASS: Xk9mQ2vLp7Rn4Wz8j
        run: |
          mkdir -p site
          cp index.html site/
          export CI=false
          printf '%s\n%s\n' "$SURGE_LOGIN" "$SURGE_PASS" | surge site/ guangyin-shoutie.surge.sh

      - name: Verify deployment
        run: |
          sleep 5
          CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" https://guangyin-shoutie.surge.sh/)
          SIZE=$(wc -c < /tmp/page.html)
          echo "http=$CODE size=$SIZE"
          grep -q "光阴手帖" /tmp/page.html && echo "CONTENT OK" || echo "CONTENT MISMATCH"
          [ "$CODE" = "200" ] && [ "$SIZE" -gt 100000 ]
